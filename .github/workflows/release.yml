name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  package:
    name: Package (${{ matrix.name }})
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            files: apps/desktop/release/*.deb apps/desktop/release/*.AppImage
          - name: Windows
            os: windows-latest
            files: apps/desktop/release/*.exe
          - name: macOS
            os: macos-latest
            files: apps/desktop/release/*.dmg
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installers
        run: npm run release
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload to release
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" ${{ matrix.files }} --clobber
        env:
          GH_TOKEN: ${{ github.token }}
